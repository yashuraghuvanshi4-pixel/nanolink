[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanolink"
version = "1.0.0"
description = "A high-performance URL shortener and analytics engine with CLI and embedded microservice"
readme = "README.md"
authors = [
  { name = "Yashu Raghuvanshi", email = "yashuraghuvanhsi33@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["url-shortener", "cli", "analytics", "developer-tool", "system-design", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities"
]

[project.scripts]
nanolink = "nanolink.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanolink*"]
